name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:architecture
      - run: pnpm check:docs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:acceptance
      - run: pnpm build
      - run: pnpm validate:plugins
      - run: pnpm smoke:package
      - run: pnpm test:concurrency
      - run: pnpm test:performance
